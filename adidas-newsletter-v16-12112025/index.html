<button class="nav" id="navL" title="הבא">
  <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
</button>
<button class="nav" id="navR" title="הקודם">
  <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
</button>
<div id="counter">1 / 15</div>

<script>
(function(){
  var total=15, cur=0;
  var strip=document.getElementById('strip');
  var counter=document.getElementById('counter');
  var navL=document.getElementById('navL');
  var navR=document.getElementById('navR');
  function goTo(n){
    cur=Math.max(0,Math.min(total-1,n));
    strip.style.transform='translateX(calc('+(-cur)+' * 100vw))';
    counter.textContent=(cur+1)+' / '+total;
    navL.disabled = cur===total-1;
    navR.disabled = cur===0;
  }
  // RTL: left arrow (‹) = next page, right arrow (›) = prev page
  navL.addEventListener('click', function(){ goTo(cur+1); });
  navR.addEventListener('click', function(){ goTo(cur-1); });
  document.addEventListener('keydown', function(e){
    if(e.key==='ArrowLeft')  goTo(cur+1);
    if(e.key==='ArrowRight') goTo(cur-1);
  });
  var tx=0;
  document.getElementById('viewer').addEventListener('touchstart',function(e){tx=e.touches[0].clientX;},{passive:true});
  document.getElementById('viewer').addEventListener('touchend',function(e){
    var dx=e.changedTouches[0].clientX-tx;
    if(Math.abs(dx)>50) goTo(dx<0 ? cur+1 : cur-1);
  },{passive:true});
  goTo(0);
})();
</script>
